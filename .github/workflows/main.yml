name: CodeTree Bot

on:
  push:
    branches: [main]
    paths:
      - 'trail2/**'
  schedule:
    - cron: '0 14 * * *'   # 매일 23:00 KST (UTC+9 → UTC 14:00)
    - cron: '0 15 * * *'   # 매일 24:00 KST = 다음날 00:00 KST (UTC 15:00)
    - cron: '0 15 1 * *'   # 매달 1일 00:00 KST
  workflow_dispatch:

jobs:
  codetree-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout CODETREE repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright axios
          npx playwright install chromium --with-deps

      - name: Run bot script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: node bot.js

      - name: Commit penalty.json if updated
        run: |
          git config user.name "codetree-bot"
          git config user.email "bot@codetree"
          git add penalty.json || true
          git diff --cached --quiet || git commit -m "chore: update penalty record"
          git push || true
